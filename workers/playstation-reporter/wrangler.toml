name = "playstation-reporter"
main = "src/index.ts"
# 按 UTC 取，写本地今天（UTC+8 快一天）会被 API 按「未来日期」拒掉
compatibility_date = "2026-08-24"
workers_dev = true

routes = [
  { pattern = "playstation-reporter.homepage.lyjw.llc", custom_domain = true }
]

[triggers]
# 每分钟只是「看一眼门」，不等于每分钟跑一轮：有人正看着才 60 秒一轮完整 tick，
# 页面只是开着（后台标签页）2 分钟一轮，一个页面都没开时门把节奏压回 15 分钟，
# 对 PSN 的闲时流量和从前一样。
crons = ["* * * * *"]

[vars]
PSN_LANGUAGE = "zh-Hans"
PSN_ACCOUNT_ID = "me"
PLAYED_GAMES_LIMIT = "100"
# 三角洲行动、明日方舟：终末地
PLAYSTATION_HIDDEN_TITLE_IDS = "PPSA28884_00,PPSA18538_00"
# 上报直连 API Worker，由它负责入库、推送和对端转发。门定节奏读的也是它的
# /count（`online` 数「此刻可见」的页面，`connections` 数「开着」的，含后台标签页）。
# 填源不填路径，和站点侧的 NEXT_PUBLIC_LIVE_PUSH_URL 同一个形状。
SITE_URL = "https://api.homepage.lyjw.llc"
# SITE_INGEST_URL = "https://api.homepage.lyjw.llc/api/ingest/playstation"

[[kv_namespaces]]
binding = "STATE"
id = "0f9b584f71634776ba3bc081a7aa4498"

[observability]
enabled = true
