name = "musickit-token"
main = "src/index.ts"
compatibility_date = "2026-08-21"
workers_dev = true

routes = [
  { pattern = "musickit-token.homepage.lyjw.llc", custom_domain = true }
]

[vars]
# 逗号分隔。**这份名单同时是两道限制**：一是谁能来要令牌（比 Origin 头），
# 二是签进 JWT 的 origin 声明 —— 后者由 Apple 校验，令牌被复制到别的站点上
# 也用不了，是真正兜底的那道。
#
# 通配项只参与第一道：Apple 不解析通配符，签进声明的是这次请求那个具体来源，
# **而且那时只签它一个**，下面这几个写死的域名不会跟着一起签出去。localhost
# 同理（它始终放行但不在名单里）。见 src/index.ts 的 signedOrigins。
#
# 和 ingest 那份是同一个名单，加域名时两个 worker 都要改、都要重新部署。
ALLOWED_ORIGINS = "https://lyjw.me,https://lyjw131.com,https://dev.lyjw.me,https://*.vercel.app"

# 令牌有效期（秒）。不填按 7 天，Apple 允许的上限是 15777000（约半年）。
# 续期不看这个数：过了「签发 → 到期」的中点就换一份新的，改这里不用调别处。
# TOKEN_TTL_SECONDS = "604800"

# Team ID 和 Key ID 不是秘密，放这里就行；私钥走 secret，见 README。
APPLE_MUSIC_TEAM_ID = "2VTXNMR2GL"
APPLE_MUSIC_KEY_ID = "88KBJL3CKU"

[observability]
enabled = true
